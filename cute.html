<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CuteVibe — Cute Video Gallery</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#fff1f7,#eef7ff);color:#26202a}header{padding:28px 18px;text-align:center;background:#fff9;backdrop-filter:blur(12px);position:sticky;top:0;z-index:5}h1{margin:0;font-size:34px}header p{margin:8px 0 0;color:#766878}.wrap{max-width:1050px;margin:auto;padding:22px}.upload{display:block;margin:0 auto 24px;padding:14px 22px;border:0;border-radius:999px;background:#ff6fae;color:white;font-weight:800;font-size:16px;cursor:pointer;box-shadow:0 8px 25px #ff6fae55}.upload input{display:none}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}.card{background:#fff;border-radius:24px;padding:10px;box-shadow:0 10px 30px #40204015}.card video{width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:18px;background:#eee}.caption{padding:9px 6px;font-weight:700}.empty{text-align:center;color:#887a88;padding:50px 10px}.heart{color:#ff5c9d}footer{text-align:center;padding:30px;color:#877987;font-size:13px}</style></head><body><header><h1>🎀 CuteVibe <span class="heart">♥</span></h1><p>Your cute little video corner</p></header><main class="wrap"><label class="upload">＋ Add Cute Videos<input id="files" type="file" accept="video/*" multiple></label><section id="grid" class="grid"></section><div id="empty" class="empty">Add your first cute video to start the gallery.</div></main><footer>Made for cute moments ✨</footer><script>const input=document.getElementById('files'),grid=document.getElementById('grid'),empty=document.getElementById('empty');let urls=[];input.onchange=()=>{[...input.files].forEach((f,i)=>{const url=URL.createObjectURL(f);urls.push(url);const card=document.createElement('article');card.className='card';card.innerHTML=`<video controls playsinline loop preload="metadata"></video><div class="caption">Cute moment ${grid.children.length+1} 💕</div>`;card.querySelector('video').src=url;grid.appendChild(card)});empty.style.display=grid.children.length?'none':'block';input.value=''};</script></body></html>
