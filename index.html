<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Lamborghini City Drive</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#72b64c;font-family:Arial;touch-action:none}canvas{display:block;width:100vw;height:100vh}.hud{position:fixed;top:12px;left:12px;color:#fff;font-weight:800;font-size:16px;text-shadow:0 2px 4px #000;z-index:5}.controls{position:fixed;left:0;right:0;bottom:18px;display:flex;justify-content:space-between;padding:0 10px;z-index:10;pointer-events:none}.group{display:flex;gap:8px;pointer-events:auto}button{width:64px;height:64px;border:2px solid #fff8;border-radius:16px;background:#111c;color:#fff;font-size:23px;font-weight:800;touch-action:manipulation}#go{width:100px;font-size:13px}#go.on{background:#159447}#brake{font-size:12px}.hint{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);color:#fff;background:#0009;padding:7px 10px;border-radius:9px;font-size:11px;z-index:5;white-space:nowrap}</style></head><body><canvas id="game"></canvas><div class="hud">LAMBORGHINI CITY DRIVE<br><span id="speed">Speed: 0 km/h</span></div><div class="hint">Tap ACCEL ON/OFF • ◀ ▶ steer • BRAKE stop</div><div class="controls"><div class="group"><button id="left">◀</button><button id="right">▶</button></div><div class="group"><button id="go">ACCEL OFF</button><button id="brake">BRAKE</button><button id="reset">↻</button></div></div><script>
const c=document.getElementById('game'),x=c.getContext('2d');let W,H,d=1;function resize(){d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;c.style.width=W+'px';c.style.height=H+'px';x.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();let car={x:0,s:0,st:0},auto=false,keys={};
function hold(id,k){let b=document.getElementById(id);b.addEventListener('touchstart',e=>{e.preventDefault();keys[k]=1},{passive:false});b.addEventListener('touchend',e=>{e.preventDefault();keys[k]=0},{passive:false});b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=1},{passive:false});b.addEventListener('pointerup',e=>{e.preventDefault();keys[k]=0},{passive:false})}hold('left','a');hold('right','d');
let go=document.getElementById('go');function toggle(e){e.preventDefault();auto=!auto;go.textContent=auto?'ACCEL ON':'ACCEL OFF';go.classList.toggle('on',auto)}go.addEventListener('touchend',toggle,{passive:false});go.addEventListener('click',e=>{if(e.detail)toggle(e)},{passive:false});document.getElementById('brake').addEventListener('touchend',e=>{e.preventDefault();auto=false;car.s=0;go.textContent='ACCEL OFF';go.classList.remove('on')},{passive:false});document.getElementById('reset').addEventListener('touchend',e=>{e.preventDefault();car={x:0,s:0,st:0};auto=false;go.textContent='ACCEL OFF';go.classList.remove('on')},{passive:false});
addEventListener('keydown',e=>keys[e.key.toLowerCase()]=1);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
function draw(){x.clearRect(0,0,W,H);x.fillStyle='#69ad48';x.fillRect(0,0,W,H);let rw=W*.58,rx=(W-rw)/2;x.fillStyle='#454a50';x.fillRect(rx,0,rw,H);x.fillStyle='#ddd';x.fillRect(rx+5,0,5,H);x.fillRect(rx+rw-10,0,5,H);x.strokeStyle='#fff';x.lineWidth=4;x.setLineDash([30,24]);x.lineDashOffset=-performance.now()/12*car.s/10;x.beginPath();x.moveTo(W/2,0);x.lineTo(W/2,H);x.stroke();x.setLineDash([]);for(let i=0;i<10;i++){let y=((i*140+performance.now()*car.s*.09)%(H+180))-120,side=i%2?rx-70:rx+rw+20,bh=70+(i%3)*35;x.fillStyle=['#71808b','#8d7666','#5d6d7a'][i%3];x.fillRect(side,y,bh,bh+100)}let cx=W/2+car.x,cy=H*.68;x.save();x.translate(cx,cy);x.rotate(car.st*.05);x.fillStyle='#111';x.fillRect(-50,-28,100,56);x.fillStyle='#e6b400';x.fillRect(-43,-23,86,46);x.fillStyle='#26313a';x.fillRect(-28,-19,56,18);x.restore()}
function loop(){if(auto||keys.w)car.s=Math.min(20,car.s+.32);else if(keys.s)car.s=Math.max(0,car.s-.7);else car.s*=.985;if(keys.a){car.x-=Math.max(2,car.s*.22);car.st=-1}else if(keys.d){car.x+=Math.max(2,car.s*.22);car.st=1}else car.st*=.8;car.x=Math.max(-W*.23,Math.min(W*.23,car.x));document.getElementById('speed').textContent='Speed: '+Math.round(car.s*10)+' km/h';draw();requestAnimationFrame(loop)}loop();
</script></body></html>
