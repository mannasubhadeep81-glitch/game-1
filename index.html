<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Lamborghini City Drive</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#111;font-family:Arial,sans-serif}canvas{display:block;width:100%;height:100%;background:linear-gradient(#75cfff 0 55%,#5b8d42 55% 100%)}#hud{position:fixed;top:16px;left:16px;color:#fff;font-weight:700;text-shadow:0 2px 4px #000;z-index:2}#help{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);color:#fff;background:#0008;padding:10px 16px;border-radius:12px;z-index:2}button{padding:10px 16px;border:0;border-radius:10px;font-weight:700} </style>
</head><body><div id="hud">LAMBORGHINI CITY DRIVE<br><span id="speed">Speed: 0</span></div><div id="help">W/S = accelerate/brake • A/D = steer • R = reset</div><canvas id="game"></canvas>
<script>
const c=document.getElementById('game'),x=c.getContext('2d');let W,H;function resize(){W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);W=innerWidth;H=innerHeight}addEventListener('resize',resize);resize();
let car={px:0,spd:0,ang:0};let keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.key.toLowerCase()==='r')car={px:0,spd:0,ang:0}});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
function road(){x.fillStyle='#50545a';x.fillRect(W*.25,0,W*.5,H);x.strokeStyle='#eee';x.lineWidth=5;x.setLineDash([35,30]);x.lineDashOffset=-(car.spd*2);x.beginPath();x.moveTo(W/2,0);x.lineTo(W/2,H);x.stroke();x.setLineDash([]);x.strokeStyle='#fff';x.lineWidth=7;x.beginPath();x.moveTo(W*.25,0);x.lineTo(W*.25,H);x.moveTo(W*.75,0);x.lineTo(W*.75,H);x.stroke()}
function city(){for(let i=0;i<14;i++){let bx=(i*137+((car.spd*8)%137))-137,bh=80+(i*53)%180;let side=i%2?W*.03:W*.77;x.fillStyle=['#8795a1','#66727d','#9b806c','#536778'][i%4];x.fillRect(side,bh*.3,W*.16,bh);for(let wy=bh*.3+15;wy<bh-8;wy+=25){x.fillStyle='#ffd85a';for(let wx=side+12;wx<side+W*.16-10;wx+=25)x.fillRect(wx,wy,10,12)}}}
function drawCar(){let cx=W/2+car.px,cy=H*.72;x.save();x.translate(cx,cy);x.rotate(car.ang*.08);x.fillStyle='#111';x.fillRect(-48,-25,96,50);x.fillStyle='#e8b600';x.fillRect(-40,-20,80,40);x.fillStyle='#20252a';x.fillRect(-25,-17,50,16);x.fillStyle='#ddd';x.fillRect(-43,-21,10,8);x.fillRect(33,-21,10,8);x.fillStyle='#111';x.fillRect(-42,17,18,9);x.fillRect(24,17,18,9);x.restore()}
function loop(){if(keys.w)car.spd=Math.min(18,car.spd+.25);else if(keys.s)car.spd=Math.max(-5,car.spd-.3);else car.spd*=.97;if(keys.a){car.px-=5;car.ang=-.35}else if(keys.d){car.px+=5;car.ang=.35}else car.ang*=.8;car.px=Math.max(-W*.22,Math.min(W*.22,car.px));x.clearRect(0,0,W,H);x.fillStyle='#72b64c';x.fillRect(0,0,W,H);city();road();drawCar();document.getElementById('speed').textContent='Speed: '+Math.round(Math.max(0,car.spd)*12)+' km/h';requestAnimationFrame(loop)}loop();
</script></body></html>
